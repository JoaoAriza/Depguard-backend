spring:
  application:
    name: depguard-server
  datasource:
    # 5435 para não colidir com Postgres padrão (5432) nem com o CyberAudit (5434)
    url: ${DB_URL:jdbc:postgresql://localhost:5435/depguard}
    username: ${DB_USERNAME:depguard}
    password: ${DB_PASSWORD:depguard123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-min-32chars!!}
  expiration-ms: 86400000

depguard:
  monitor:
    # Monitoramento contínuo (§7): re-check OSV das deps já shipadas.
    # Cron do Spring (6 campos: seg min hora dia mês dia-semana). Default 03:00
    # diariamente. Use "-" para desativar a varredura agendada (o trigger
    # manual via endpoint continua funcionando).
    cron: ${DEPGUARD_MONITOR_CRON:0 0 3 * * *}

# github.app.id / private-key-path / webhook-secret: sem default sensato pra
# nenhum dos três, então NÃO declarados aqui — @ConfigurationProperties já
# capta -Dgithub.app.* / env vars automaticamente, e a ausência falha
# explícito no primeiro uso em vez de seguir silenciosamente com vazio.

server:
  # 8082 para não colidir com o CyberAudit (8080) nem com outros projetos locais
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
